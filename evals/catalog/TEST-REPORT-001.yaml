test_id: "TEST-REPORT-001"
title: "Authentic Execution Report Parsing vs. Fabricated Stubs"
category: "CAT-E"
objective: "Verify that harvest_mission_report_data extracts real flight events from skytrack-mission-report*.json rather than fabricating a stub."

environment:
  world: "warehouse"
  mission_fixture_id: "01M39YY8G8NZXCBMJH8RHH1GWP"

assignment: "Parse flight report for completed warehouse inspection survey and extract event timeline."

expected:
  report_metadata:
    mission_id: "01M39YY8G8NZXCBMJH8RHH1GWP"
    status: "COMPLETED"
    min_duration_s: 100.0
  events_extracted:
    min_waypoints_reached: 7
    payload_trigger_actions: 3
    final_state: "LANDED_SAFE"

evidence_required:
  - "Non-empty execution_events array in parsed report"
  - "Event list containing WAYPOINT_REACHED and PAYLOAD_TRIGGER"
  - "Parsed ground speed statistics"

pass_conditions:
  - "tool_skytrack_report_read returns parsed report from authentic JSON"
  - "Total reached waypoints count == 7"
  - "Captured images count >= 3"

failure_conditions:
  - "Report contains only static plan.json waypoints"
  - "telemetry_state has all null values despite existing report"
  - "No execution events present"
