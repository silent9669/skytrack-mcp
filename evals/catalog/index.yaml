version: "1.0"
test_suite: "SkyTrack Autonomous Agent & MCP Verification Suite"
categories:
  - id: "CAT-A"
    name: "Basic MCP Correctness & State Synchronization"
    description: "Verifies atomic MCP tools, ClientData sync, world/vehicle queries, and state persistence."
  - id: "CAT-B"
    name: "Mission Authoring & Schema Conformance"
    description: "Verifies waypoint sequences, altitude constraints, action conversions, and validation logic."
  - id: "CAT-C"
    name: "Coordinate Accuracy & Frame Semantics"
    description: "Verifies ENU/NED frames, positive directions, relative offsets, and spatial metric calculations."
  - id: "CAT-D"
    name: "Simulation Execution & Real-Time Observation"
    description: "Verifies container lifecycle, GCS dispatch, real-time polling until touchdown, and avoidance."
  - id: "CAT-E"
    name: "Authentic Mission Report Parsing & Verification Oracles"
    description: "Verifies extraction of real flight reports (skytrack-mission-report*.json) and requirement matrices."
  - id: "CAT-F"
    name: "Adversarial, Negative & Self-Healing Testing"
    description: "Tests recovery from corrupted plans, invalid altitudes, exceeding payload limits, and UI stalls."

tests:
  - id: "TEST-MCP-001"
    category: "CAT-A"
    title: "Environment and Healthcheck Baseline"
    file: "evals/catalog/TEST-MCP-001.yaml"
  - id: "TEST-COORD-001"
    category: "CAT-C"
    title: "Calibration: ENU Axis Orientation and Origin Verification"
    file: "evals/catalog/TEST-COORD-001.yaml"
  - id: "TEST-GOLDEN-001"
    category: "CAT-D"
    title: "Golden Mission: Warehouse Waypoint Sweep with Ground-Truth Flight"
    file: "evals/catalog/TEST-GOLDEN-001.yaml"
  - id: "TEST-REPORT-001"
    category: "CAT-E"
    title: "Authentic Execution Report Parsing vs. Fabricated Stubs"
    file: "evals/catalog/TEST-REPORT-001.yaml"
  - id: "TEST-FAIL-001"
    category: "CAT-F"
    title: "Refusal of False Success on Incomplete Flight Execution"
    file: "evals/catalog/TEST-FAIL-001.yaml"
